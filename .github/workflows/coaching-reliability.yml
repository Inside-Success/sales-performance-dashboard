name: Coaching reliability regression gate
on:
  pull_request:
    paths:
      - 'scripts/n8n/**'
      - 'scripts/coaching-upgrade/**'
      - 'src/lib/objection-coaching*'
      - 'src/lib/report-version.ts'
      - 'src/lib/report-chat.ts'
      - 'src/app/manager/coaching-insights/**'
      - 'src/lib/coaching-*.ts'
      - 'src/lib/coaching-*.mjs'
      - 'src/lib/provider-checkpoint*'
      - 'src/app/api/internal/**'
      - 'src/app/api/ingest/**'
      - 'src/app/api/manual-reports/**'
      - 'src/app/call/**'
      - 'src/app/self-report/**'
      - 'src/app/submit/**'
      - 'src/components/dashboard/**'
      - 'src/lib/db.ts'
      - 'src/lib/manual-*.ts'
      - 'src/lib/coaching-review/**'
      - 'src/app/manager/coaching-review/**'
      - 'tests/coaching-review/**'
      - 'scripts/publish-coaching-review.ts'
      - 'tests/coaching*'
      - 'tests/coaching/**'
      - '.github/workflows/coaching-reliability.yml'
permissions:
  contents: read
jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/coaching tests/coaching-review src/lib/coaching-reliability-policy.test.ts src/lib/coaching-coverage.test.ts src/lib/coaching-source-claim.test.ts src/lib/dashboard-read-snapshot.test.ts tests/dashboard-read-snapshot.test.ts src/lib/provider-checkpoint-policy.test.ts src/lib/provider-checkpoints.test.ts
      - run: node scripts/n8n/verify-handoff-safety.mjs
      - run: node scripts/n8n/verify-recovery-retry-policy.mjs
      - run: node scripts/n8n/verify-durable-provider.mjs
      - run: node scripts/n8n/verify-crash-recovery.mjs
      - run: node scripts/n8n/verify-reliability-contract.mjs
      - run: node scripts/n8n/verify-source-accounting.mjs
      - run: node scripts/n8n/verify-accounting-handoffs.mjs
      - run: node scripts/n8n/verify-upstream-no-show-accounting.mjs
      - run: npx tsc --noEmit
      - run: npm run build
